version: 2
updates:
  - package-ecosystem: "github-actions"
    # Propose new versions only after 14 days (supply chain);
    # security updates are not delayed.
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
