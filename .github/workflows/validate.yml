name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: catches PHP release drift and base image changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor of the Anthropic PHP SDK.
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check all production files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -not -path './tests/*' -not -path './dev/*' -not -path './vendor*' -print0)
          exit $fail

      - name: Unit tests
        run: php tests/unit.php

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2

  # Single aggregating context for the branch ruleset. The lint matrix produces
  # one job name per PHP version; this job is the only context the ruleset
  # knows about, so the matrix can change freely underneath it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [lint, actionlint]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          exit 1
